<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Achievements | PortfolioHub</title><link rel="stylesheet" href="style.css"></head>
<body class="app-bg"><header class="appbar"><a class="brand" href="index.html">Portfolio<span>Hub</span></a><div class="userbar"><span id="navUser"></span><button class="btn btn-sm danger" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="sidebar" id="userSidebar"></aside><main class="content"><div class="page-title"><div><span>ACHIEVEMENTS</span><h1>Showcase achievements</h1><p>Certificates, awards, competitions and milestones.</p></div><button class="btn primary" onclick="openAchievementForm()">+ Add Achievement</button></div><form id="achievementForm" class="panel hidden form-grid"><input type="hidden" id="achievementId"><div><label>Achievement</label><input id="achievementTitle" required placeholder="GitHub Foundations"></div><div><label>Issuer</label><input id="achievementIssuer" placeholder="DataCamp"></div><div><label>Date</label><input id="achievementDate" placeholder="September 2026"></div><div><label>Credential URL</label><input id="achievementLink" type="url" placeholder="https://..."></div><div class="form-full"><label>Description</label><textarea id="achievementDesc" rows="3" placeholder="What did you achieve?"></textarea></div><div class="form-full form-actions"><button class="btn primary">Save Achievement</button><button type="button" class="btn ghost" onclick="closeAchievementForm()">Cancel</button></div><p id="achievementMsg" class="message form-full"></p></form><div id="achievementsList" class="manage-grid"></div><section class="certifications-section"><div class="page-title"><div><span>CERTIFICATIONS</span><h2>My Certifications</h2><p>Upload and manage certificate photos.</p></div><button class="btn primary" type="button" onclick="openCertificationForm()">+ Add Certification</button></div>
<form id="certForm" class="panel hidden form-grid"><input type="hidden" id="certificationId"><div><label>Certification Name</label><input id="certName" required placeholder="GitHub Foundations"></div><div><label>Issuing Organization</label><input id="certIssuer" required placeholder="DataCamp / Cisco"></div><div><label>Issue Date</label><input id="certDate" type="date"></div><div><label>Certificate ID</label><input id="certNumber" placeholder="Optional certificate ID"></div><div class="form-full"><label>Credential URL</label><input id="certLink" type="url" placeholder="https://..."></div><div class="form-full"><label>Upload Certificate Photo</label><input id="certImageFile" type="file" accept="image/*"><input id="certImage" type="hidden"><div id="certImagePreview" class="upload-preview">Certificate preview</div></div><div class="form-full form-actions"><button class="btn primary" type="submit">Save Certification</button><button class="btn ghost" type="button" onclick="closeCertificationForm()">Cancel</button></div></form>
<div id="certificationsList" class="manage-grid"></div></section></main></div><script src="image-upload.js"></script><script src="script.js"></script></body></html>
